name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Run unit tests
        run: python -m pytest
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Compile sources
        run: python -m compileall -q adapters models services storage utils main.py
