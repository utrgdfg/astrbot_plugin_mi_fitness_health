name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Run tracked repository privacy gate
        run: python scripts/privacy_gate.py --repository .
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Run unit tests
        run: python -m pytest
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Compile sources
        run: python -m compileall -q adapters compat features models services storage utils main.py
      - name: Build installable archive
        run: python scripts/build_release.py --output-dir dist
      - name: Run release archive privacy gate
        run: python scripts/privacy_gate.py --archive dist/*.zip
      - name: Keep the Python 3.12 release candidate
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: astrbot-plugin-installation-zip
          path: dist/*.zip
          if-no-files-found: error

  astrbot-runner-contract:
    name: AstrBot runner contract (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        channel: ["minimum-supported", "latest-stable-4x"]

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve AstrBot compatibility reference
        id: astrbot_ref
        env:
          GH_TOKEN: ${{ github.token }}
          ASTRBOT_CHANNEL: ${{ matrix.channel }}
        run: |
          if [ "$ASTRBOT_CHANNEL" = "minimum-supported" ]; then
            ref="v4.24.2"
          else
            ref="$(gh api 'repos/AstrBotDevs/AstrBot/releases?per_page=100' | \
              python plugin/scripts/select_latest_astrbot_4x.py)"
            case "$ref" in
              v4.*) ;;
              *) echo "Latest stable AstrBot release is not a v4.x tag: $ref" >&2; exit 1 ;;
            esac
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out AstrBot ${{ steps.astrbot_ref.outputs.ref }}
        uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: ${{ steps.astrbot_ref.outputs.ref }}
          path: astrbot-runtime
      - name: Check private runner compatibility contract
        run: >-
          python plugin/scripts/check_astrbot_runner_contract.py
          astrbot-runtime
